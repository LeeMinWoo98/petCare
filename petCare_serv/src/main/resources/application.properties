spring.application.name=petCare

# MariaDB 연결 설정 (docker-compose 기본값과 동일)
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:petcare}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USER:petcare}
spring.datasource.password=${DB_PASSWORD:petcare1234}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA 설정 (스키마는 Flyway가 관리)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# Flyway 마이그레이션
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis 연결 설정
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.redis.enabled=${APP_REDIS_ENABLED:true}
app.scheduling.enabled=${APP_SCHEDULING_ENABLED:true}

# Actuator (추후 Step 6 Prometheus 연동 대비)
management.endpoints.web.exposure.include=health,info,metrics

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# CORS 허용 도메인 (배포 시 환경변수 APP_CORS_ALLOWED_ORIGINS로 지정 가능, 쉼표로 여러 도메인 입력)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
